name: Vérification des prix

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: two concurrent jobs would fight over the push of data/.
concurrency:
  group: fare-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Vérifier les prix
        run: npm start
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # Also runs when a route failed: the readings of the other routes are kept.
      - name: Commit des données
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          git commit -m "data: relevé du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
