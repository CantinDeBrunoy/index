# Magellan, la fiche en anglais. Relue et vérifiée dans le code le 10 octobre 2026.
why: "I wanted to see everywhere I've already been at a glance."
features:
  - title: "The globe fills in"
    text: "Visited countries light up, each city gets its flag and an arc links the stops."
  - title: "Trips as index cards"
    text: "Sorted by year, with a sticky note per stop, a postcard per city and the budget."
  - title: "Photos sort themselves"
    text: "On the web version, the app reads the date and place of the iCloud photos and files each one under the right stop; the ones it isn't sure about wait for my approval."
choices:
  - title: "One codebase"
    text: "Expo and React Native for iOS, Android and the web, from the same code."
  - title: "globe.gl for the Earth"
    text: "A proven 3D globe, the same on phones and on the web: a WebView on one side, a frame in the page on the other."
video:
  src: "/demos/magellan.mp4"
  caption: "The globe, the list of trips, then two of them: Tokyo, Kyoto and Osaka, and Marrakech. With the demo trips."
capture:
  alt: "Screenshot of Magellan: the globe and its coloured countries, with the counter of the demo data (14 trips, 22 cities, 13 countries)."
  caption: "The globe, with the demo trips."
