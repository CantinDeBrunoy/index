# gym-picker, la fiche en anglais. Relue et vérifiée dans le code le 10 octobre 2026, réécrite plus simplement le 14 octobre.
why: "I have several gyms at about the same distance, and it's the traffic that decides which one is quickest to reach. Instead of checking each one in Waze, I open gym-picker, which compares them all at once."
features:
  - title: "Live traffic"
    text: "Gyms are listed from nearest to farthest by driving time, traffic jams included."
  - title: "One tap and you're off"
    text: "Tap a gym and Waze opens with the route ready. A “Maps” button does the same with Google Maps."
choices:
  - title: "TomTom traffic, through Cloudflare"
    text: "Travel times come from TomTom, but the app never calls it directly. It goes through a small server at Cloudflare, which keeps the access key secret and limits each IP address to 20 requests a minute."
  - title: "My location kept out of the logs"
    text: "The app sends my location in the body of the request, not in the address. Since server logs record addresses, my location never shows up in them."
video:
  src: "/demos/gym-picker.mp4"
  caption: "Gyms ranked by driving time, the ranking that follows the traffic, then the fallback home. With fictional gyms and trips."
  width: 1280
  height: 720
screens:
  - image: "classement"
    title: "The ranking"
    text: "Gyms sorted by driving time, traffic included, the fastest in green. The calculation takes a second or two, shown at the top."
    alt: "gym-picker in demo mode: four fictional gyms ranked, Palais-Royal first at 7 minutes."
  - image: "actualiser"
    title: "Traffic changes"
    text: "“Actualiser” (refresh) runs the calculation again. With traffic, the quickest gym isn't always the same from one time to the next."
    alt: "The same ranking after a refresh: Odéon moves to first, Palais-Royal drops to 15 minutes."
  - image: "domicile"
    title: "Without GPS"
    text: "If the GPS doesn't answer, routes start from the backup home, saved on the phone and nowhere else."
    alt: "The message “GPS indisponible : trajets calculés depuis ton domicile” above the ranking."
architecture:
  intro: "A small React app you install on your phone, and a Cloudflare Worker that queries TomTom on its behalf. There's no database. The gyms are written in the code, and the home address stays on the phone."
  groups:
    - { label: "On the phone", from: [1, 1], to: [2, 2] }
    - { label: "Cloudflare", from: [3, 1], to: [3, 1] }
  nodes:
    - { id: "local", at: [1, 1], kind: "data", title: "GPS · home", text: "A fix that's fast rather than precise. Without GPS, the backup home, kept here." }
    - { id: "app", at: [2, 1], kind: "app", title: "The React app", text: "Opens from cache, but travel times are always computed live. A visitor sees a demo with made-up gyms." }
    - { id: "waze", at: [2, 2], kind: "ext", title: "Waze · Google Maps", text: "Tapping a gym opens the route." }
    - { id: "worker", at: [3, 1], kind: "server", title: "gym-picker Worker", text: "Checks the position, allows 20 calls a minute, sorts the gyms." }
    - { id: "tomtom", at: [4, 1], kind: "ext", title: "TomTom Matrix Routing", text: "Travel times to every gym at once, traffic included." }
  links:
    - { from: "app", to: "local", label: "the position" }
    - { from: "app", to: "worker", label: "the position, not in the URL", both: true }
    - { from: "worker", to: "tomtom", label: "one call, 4 s at most", both: true }
    - { from: "app", to: "waze", label: "a tap" }
crew:
  title: "Solo flight"
  text: "A tool for myself, built on my own with the help of Claude Code. I started with a real brief: the need, a success criterion (an answer in under 5 seconds), then the decisions and their reasons."
  log:
    - title: "Timeline"
      text: "Late September 2026, then the demo mode in October."
    - title: "Method"
      text: "A handover document: the need, the architecture, the decisions, the pitfalls. Conventional commits."
    - title: "Quality"
      text: "About twenty Vitest tests on the pure functions, plus oxlint and TypeScript on every push."
    - title: "Shipping"
      text: "GitHub Actions deploys the Worker on every push. The TomTom key is stored in the Worker's secrets."
