# gym-picker, la fiche en anglais. Brouillon, à réécrire.
why: "My gyms are all about the same distance away: traffic decides which one is closest. Rather than checking them one by one in Waze, the app compares them all at once."
features:
  - title: "Live traffic"
    text: "Every gym ranked by driving time, traffic included."
  - title: "One tap and off you go"
    text: "Tapping a gym opens Waze or Google Maps with the route."
choices:
  - title: "A Cloudflare Worker in front of the API"
    text: "The key never leaves the server, and each IP address is limited to 20 calls a minute."
video:
  src: "/demos/gym-picker.mp4"
  caption: "Gyms ranked by driving time, the ranking that follows the traffic, then the fallback home. With fictional gyms and trips."
  width: 1280
  height: 720
