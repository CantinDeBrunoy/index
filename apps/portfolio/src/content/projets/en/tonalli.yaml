# Tonalli, la fiche en anglais. Relue et vérifiée dans le code le 10 octobre 2026.
why: "I wanted to keep track of my days without turning it into a social network: no feed, no comments, just a month filling with colour, square by square."
features:
  - title: "A colour a day"
    text: "One emotion out of twelve, in three intensities, gives the day its colour."
  - title: "Two photos in the moment"
    text: "The scene, then your face, in a single tap in the app, never from the gallery."
  - title: "The other's calendar"
    text: "It only reveals itself once you've filled in your own day, and you reply with an emoji."
  - title: "A reminder at my hour"
    text: "A notification, at the time you choose, reminds you to fill in your day; a day saved offline is sent as soon as you're back online."
choices:
  - title: "Reciprocity written into the database"
    text: "Supabase access rules enforce it in SQL, and it can't be got around from the browser."
  - title: "The author's day"
    text: "An entry's date is computed in its author's time zone, never in UTC; otherwise, in the evening, the day shifts."
  - title: "A website rather than an app"
    text: "Tonalli started as a mobile app, then became a website you can install: a link is all it takes to start."
video:
  src: "/demos/tonalli.mp4"
  caption: "The concept, the day's emotion, the two photos, the other's day revealed, the calendar and the character. With a demo account."
  width: 1280
  height: 720
capture:
  alt: "Screenshot of Tonalli: the home screen, the drop character and the sign-in buttons."
  caption: "The home screen."
screens:
  - image: "emotion"
    title: "Today's emotion"
    text: "Twelve emotions and three intensities, 36 shades in all; the character strikes the pose of the one you pick."
    alt: "The “Comment te sens-tu ?” screen: twelve emotions, Colère selected, and three intensities."
  - image: "aujourdhui"
    title: "Today"
    text: "The two characters act out a scene based on both emotions; the other person's day waits until you've filled in yours."
    alt: "The “Aujourd'hui” screen: two characters side by side, “Ma journée” and “La journée de Léa”."
  - image: "calendrier"
    title: "The calendar"
    text: "One square per day, hatched when it's missing or still hidden, and the year's breakdown of emotions."
    alt: "The year calendar: a row of coloured squares per month, then the year's breakdown by emotion."
  - image: "personnage"
    title: "The character"
    text: "Accessories to choose; it keeps the colour of the day and wears them in every scene."
    alt: "The “Mon personnage” screen: the orange character with ears and a scarf, and the accessories to choose from."
architecture:
  intro: "A React web app you install on your phone, hosted on Vercel, with Supabase behind it: sign-in, the Postgres database, the photos, and two functions that send the notifications."
  groups:
    - { label: "Supabase", from: [2, 1], to: [3, 2] }
  nodes:
    - { id: "app", at: [1, 1], span: [1, 2], kind: "app", title: "The React app", text: "On the phone, installed like an app. A day saved offline waits for the network to come back." }
    - { id: "db", at: [2, 1], kind: "data", title: "Postgres", text: "Days and reactions; the other person's day stays hidden until you've filled in yours." }
    - { id: "storage", at: [2, 2], kind: "data", title: "Auth · Storage", text: "Email sign-in; the photos, private, read through signed links." }
    - { id: "fn", at: [3, 1], kind: "server", title: "Edge Functions", text: "Tell the other person, and remind you to fill in your day." }
    - { id: "cron", at: [3, 2], kind: "job", title: "Scheduled job", text: "Every quarter of an hour, finds who is due a reminder." }
    - { id: "push", at: [4, 1], kind: "ext", title: "Push service", text: "The browser's own: it wakes the phone up." }
    - { id: "sw", at: [4, 2], kind: "app", title: "Service worker", text: "Shows the notification, even with the app closed." }
  links:
    - { from: "app", to: "db", label: "days, reactions", both: true }
    - { from: "app", to: "storage", label: "sign-in, photos", both: true }
    - { from: "db", to: "fn", label: "a trigger" }
    - { from: "cron", to: "fn", label: "reminder time" }
    - { from: "fn", to: "push", label: "Web Push" }
    - { from: "push", to: "sw", label: "the notification" }
crew:
  title: "Solo flight"
  text: "A personal project, from mock-up to launch: I made every decision, coded it with the help of Claude Code, and reviewed every branch before merging it."
  log:
    - title: "Timeline"
      text: "From late August to late September 2026, then into INDEX in October."
    - title: "Method"
      text: "A handover guide of over a thousand lines: the rules, the pitfalls already met, what's left to do. One branch per piece of work, merged after review."
    - title: "Quality"
      text: "About 250 home-made checks (dates and time zones, shades, reactions…), oxlint and TypeScript on every push."
    - title: "Shipping"
      text: "Vercel for the site; the database and its functions deployed by hand; a robot keeps Supabase awake."
