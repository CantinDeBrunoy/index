# Cancionero, la fiche en anglais. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Cancionero turns every song into a Spanish lesson: you read it, understand it, sing it, and the words stay."
features:
  - title: "Translated lyrics"
    text: "Each line with its French translation, and its pronunciation to listen to."
  - title: "Karaoke"
    text: "The current line grows and fills, in time with the lyrics when they are timestamped; without sound, for now."
  - title: "Words to review"
    text: "A word tapped in the lyrics or the karaoke becomes a card, to flip and then swipe to sort, even offline."
choices:
  - title: "An installable app"
    text: "It installs from the browser and works offline, whereas an iOS app would have needed an Apple developer account."
  - title: "Expo and React Native Web"
    text: "The same code serves the web today, and will serve phones tomorrow."
  - title: "Next to no server"
    text: "Lyrics come from LRCLIB, missing translations from MyMemory, and the vocabulary stays on the device."
video:
  src: "/demos/cancionero.mp4"
  caption: "Three words saved from “Hola, ¿cómo estás?”, the karaoke, then the flashcards."
capture:
  alt: "Screenshot of Cancionero: the vocabulary to review and the list of songs, from “Hola, ¿cómo estás?” to “En el mercado”."
  caption: "The songs and the vocabulary to review."
screens:
  - image: "accueil"
    title: "The songs"
    text: "Three songs written for the app, from beginner to intermediate, with the pile of words to review at the top."
    alt: "Cancionero's home screen: a garland of flags, the “Vocabulaire à réviser” card and three songs."
  - image: "chanson"
    title: "A song"
    text: "Every word can be tapped and goes into your review pile; every line has its translation and a synthetic voice."
    alt: "The song “Hola, ¿cómo estás?”: three highlighted words and the message “noches ajouté à tes révisions”."
  - image: "karaoke"
    title: "The karaoke"
    text: "The current line grows and fills, its translation just below. Without timestamped lyrics, lines are spaced out by estimate, and the app says so."
    alt: "Full-screen karaoke: the line “Muy bien, gracias, ¿y tú qué tal?” in large type, its translation below, and “Timing approximatif”."
  - image: "cartes"
    title: "The cards"
    text: "The words you set aside, flipped with a tap, then swiped: “I know it” or “Review again”."
    alt: "A review card: the word “noches”, the song it comes from, and the “À revoir” and “Je le connais” buttons."
architecture:
  intro: "An Expo app exported as a static site, installable like an app and usable offline. No account, no database: whatever you keep stays on the device."
  groups:
    - { label: "On the device", from: [1, 1], to: [3, 1] }
  nodes:
    - { id: "local", at: [1, 1], kind: "data", title: "localStorage", text: "Added songs, words to review, translations already fetched." }
    - { id: "app", at: [2, 1], kind: "app", title: "The Expo app", text: "React Native Web, and the app's three songs." }
    - { id: "sw", at: [3, 1], kind: "app", title: "Service worker", text: "Keeps the site in cache: the app opens without a network." }
    - { id: "worker", at: [4, 1], kind: "server", title: "cancionero Worker", text: "Serves the site; about ten lines give each song its own page." }
    - { id: "apis", at: [2, 2], kind: "ext", title: "LRCLIB · MyMemory", text: "Lyrics for real songs, and the missing translations." }
  links:
    - { from: "app", to: "local", label: "what you keep", both: true }
    - { from: "app", to: "sw", label: "every request" }
    - { from: "sw", to: "worker", label: "when online" }
    - { from: "app", to: "apis", label: "on demand", both: true }
crew:
  title: "Solo flight"
  text: "I came up with it and built it on my own, with Claude Code as an assistant: each piece of work on its own branch, reviewed then merged."
  log:
    - title: "Timeline"
      text: "October 2026: the first version, the installable app and the “Papel” redesign, then the move to Cloudflare."
    - title: "Method"
      text: "One branch per piece of work, merged by hand. Main is production."
    - title: "Quality"
      text: "TypeScript checked and the site rebuilt on every push."
    - title: "Shipping"
      text: "GitHub Actions redeploys the Worker on every push to main."
