# Cancionero, la fiche en anglais. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Cancionero turns every song into a Spanish lesson: you read it, understand it, sing it, and the words stay."
features:
  - title: "Translated lyrics"
    text: "Each line with its French translation, and its pronunciation to listen to."
  - title: "Karaoke"
    text: "The line being sung grows and fills in time with the song."
  - title: "Words to review"
    text: "A word tapped in the lyrics or the karaoke becomes a card, to flip and then swipe to sort, even offline."
choices:
  - title: "An installable app"
    text: "It installs from the browser and works offline, whereas an iOS app would have needed an Apple developer account."
  - title: "Expo and React Native Web"
    text: "The same code serves the web today, and will serve phones tomorrow."
  - title: "Next to no server"
    text: "Lyrics come from LRCLIB, missing translations from MyMemory, and the vocabulary stays on the device."
video:
  src: "/demos/cancionero.mp4"
  caption: "Three words saved from “Hola, ¿cómo estás?”, the karaoke, then the flashcards."
capture:
  alt: "Screenshot of Cancionero: the vocabulary to review and the list of songs, from “Hola, ¿cómo estás?” to “En el mercado”."
  caption: "The songs and the vocabulary to review."
