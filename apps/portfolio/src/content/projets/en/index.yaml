# INDEX, la fiche en anglais. Brouillon, à réécrire.
why: "My projects each lived in their own corner, and some fell asleep on free tiers. INDEX gathers them in a single repository, keeps them awake, and shows them here, numbered, like the stops of a journey."
features:
  - title: "One repository"
    text: "All ten projects imported with their full history, each in its own folder."
  - title: "Nothing falls asleep"
    text: "A bot keeps Tonalli's database awake, checks every site each hour and opens an issue if one goes down."
  - title: "Every project in its place"
    text: "A number, a project page and a stop: this very site."
choices:
  - title: "pnpm and Turborepo"
    text: "Each project keeps its own versions; only the ones that change are rebuilt and tested."
  - title: "Two hosts"
    text: "Apps already on Vercel stay there, with their addresses; the others move to Cloudflare Workers."
  - title: "The wake-up call in GitHub Actions"
    text: "A real request keeps Supabase awake, and the repository re-enables itself so its scheduled jobs never stop."
