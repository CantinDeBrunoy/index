    - { id: "app", at: [2, 1], kind: "app", title: "The Flutter app", text: "iOS and Android, five tabs: around me, likes, map, notebooks, profile." }
    - { id: "firebase", at: [3, 1], kind: "ext", title: "Firebase", text: "Accounts, interests, liked places and notebooks." }
    - { id: "mapbox", at: [2, 2], kind: "ext", title: "Mapbox", text: "The map and its pins." }
  links:
