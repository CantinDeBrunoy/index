# Mithril, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Je voulais un coffre à mots de passe que je puisse relire en entier : sans cloud, sans dépendance, compilé avec ce que Windows fournit déjà. N'importe qui peut le recompiler pour vérifier."
features:
  - title: "Des mots de passe solides"
    text: "De 8 à 128 caractères, sans les caractères qu'on confond si on le souhaite, avec leur force affichée."
  - title: "Un coffre chiffré"
    text: "Windows chiffre le coffre ; un mot de passe maître, facultatif, ajoute une couche AES-256. C'est lui qui protège le coffre portable du téléphone."
  - title: "La frappe automatique"
    text: "Ctrl+Alt+M tape le mot de passe dans la fenêtre active, sans passer par le presse-papiers."
choices:
  - title: "Aucune dépendance"
    text: "Compilé par csc.exe, le compilateur livré avec Windows, sans installeur : un seul .exe."
  - title: "Le téléphone, sans cloud"
    text: "Appairé par un code à six chiffres, il se synchronise sur le réseau local ou par Tailscale, et chaque côté vérifie l'autre."
  - title: "Un tirage sans biais"
    text: "Le générateur cryptographique de Windows, en écartant les tirages biaisés : chaque caractère a exactement la même chance de sortir."
