# Galactic Escape, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026, réécrite plus simplement le 14 octobre.
why: "Un projet d'école, à cinq, en 2022. Il fallait créer un jeu complet qui tourne dans le navigateur. Nous sommes partis de Temple Run, où l'on court pour échapper à un monstre, et nous l'avons emmené dans l'espace, avec une différence : c'est le joueur qui pose lui-même les cases du chemin."
features:
  - title: "Un chemin case par case"
    text: "On prolonge sa route en posant des cases à une, deux ou trois sorties. Avant de poser une case, un aperçu montre si elle se raccorde au chemin."
  - title: "Le fisc aux trousses"
    text: "Michel, un petit alien, est poursuivi par Roberto, un agent du fisc. Plus on pose les cases vite, plus Michel prend de l'avance."
  - title: "Des météores sur la route"
    text: "Des météores bloquent certaines cases et obligent à faire un détour. Il y a quatre niveaux, de « facile » à « impossible », et plus le niveau est haut, plus tout va vite."
choices:
  - title: "Three.js pour la scène, React pour le reste"
    text: "Three.js affiche la partie en 3D dans le navigateur. Les menus, l'inventaire et le chronomètre sont faits avec React, comme une page web classique."
  - title: "La logique à part, et testée"
    text: "Les règles du jeu (le placement des cases, l'inventaire, la création de la carte) sont codées à part de la 3D, ce qui permet de les tester automatiquement. Les tests tournaient avec Jest en 2022, et tournent avec Vitest depuis la reprise du projet en 2026."
video:
  src: "/demos/galactic-escape.mp4"
  caption: "Le menu sur Mars et ses niveaux, puis une partie, où chaque case posée prolonge le chemin de Michel. Mets le son, il y a de la musique."
  width: 1920
  height: 1080
  rate: 1
screens:
  - image: "menu"
    title: "Le menu sur Mars"
    text: "Derrière les menus (jouer, scores, réglages, aide, crédits), Mars tourne en 3D."
    alt: "Le menu de Galactic Escape : six entrées en vert à gauche, et Mars qui tourne à droite."
  - image: "depart"
    title: "La première case"
    text: "À gauche, l'inventaire des cases. Autour de Michel, trois places où en poser une. L'aperçu devient rouge quand la case ne se raccorde pas au chemin."
    alt: "Le début d'une partie : l'inventaire à gauche, trois places autour de l'alien, celle du haut en rouge, et « Place une case pour commencer »."
  - image: "chemin"
    title: "Le chemin"
    text: "Les cases posées tracent la route en bleu. En haut, le chrono et le score, qui monte de plus en plus vite à mesure que la partie dure."
    alt: "Une partie après 21 secondes : un chemin de cases bleues sous l'alien, le chrono et un score de 14."
architecture:
  intro: "Un jeu qui tourne entièrement dans le navigateur, sans serveur. Les règles sont écrites à part, en JavaScript simple, et une scène Three.js redessine la partie à chaque image."
  groups: []
  nodes:
    - { id: "ui", at: [1, 1], kind: "app", title: "React", text: "Les menus, l'inventaire de cinq cases, le chrono et le score." }
    - { id: "store", at: [2, 1], kind: "app", title: "Le store", text: "Un contexte React et un reducer. Chaque geste du joueur y passe avant d'aller à la logique et à la 3D." }
    - { id: "core", at: [3, 1], kind: "file", title: "La logique", text: "En JavaScript simple : la grille, les cases à quatre portes, le bord du plateau qui s'effondre." }
    - { id: "storage", at: [1, 2], kind: "data", title: "localStorage", text: "Les réglages et le meilleur score de chaque difficulté." }
    - { id: "three", at: [2, 2], span: [2, 1], kind: "app", title: "Three.js", text: "Redessine la grille à chaque image, et repère sous la souris la place où poser une case." }
  links:
    - { from: "ui", to: "store", label: "les gestes" }
    - { from: "store", to: "core", label: "les actions" }
    - { from: "ui", to: "storage", label: "réglages, scores", both: true }
    - { from: "three", to: "store", label: "les clics" }
    - { from: "core", to: "three", label: "l'état de la grille" }
crew:
  title: "À cinq"
  text: "Un projet d'école, à cinq. J'ai intégré le personnage et les premiers météores en 3D, puis codé l'inventaire, la rotation des cases, le menu des difficultés, le chrono, le score et les pages d'aide et de crédits. Le moteur du jeu et la scène 3D sont l'œuvre d'un coéquipier."
  log:
    - title: "Période"
      text: "De janvier à avril 2022. Repris dans INDEX en 2026."
    - title: "Méthode"
      text: "Une branche par ticket, fusionnée dans develop puis dans master (Git flow). 78 tickets triés entre « indispensable » et « bonus », quatre étapes et 60 pull requests relues."
    - title: "Qualité"
      text: "ESLint et Prettier pour un code propre et uniforme. Des tests Jest sur la logique du jeu, passés à Vitest lors de la reprise en 2026."
    - title: "Mise en ligne"
      text: "Sur Heroku à l'époque, chez Cloudflare aujourd'hui."
