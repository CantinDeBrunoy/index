# Galactic Escape, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Un projet d'école, à cinq, en 2022 : faire un jeu complet qui tourne dans le navigateur. Nous sommes partis du jeu du plombier, où l'on pose des tuyaux pour guider l'eau, et nous l'avons emmené dans l'espace, un monstre à nos trousses."
features:
  - title: "Un chemin case par case"
    text: "On pose des cases à une, deux ou trois sorties pour prolonger sa route, et un aperçu montre si elle se raccorde."
  - title: "Le fisc aux trousses"
    text: "Michel, un petit alien, fuit Roberto, l'agent du fisc lancé à sa poursuite : chaque case posée vite lui donne de l'avance."
  - title: "Des météores sur la route"
    text: "Ils condamnent des cases et forcent à faire le tour. Quatre niveaux, de « facile » à « impossible » : plus on monte, plus ça va vite."
choices:
  - title: "Three.js pour la scène, React pour le reste"
    text: "La partie se joue en 3D ; les menus, l'inventaire et le chronomètre sont de simples composants React."
  - title: "La logique à part, et testée"
    text: "Le placement des cases, l'inventaire et la génération de la carte vivent hors de la 3D, vérifiés par des tests Vitest."
video:
  src: "/demos/galactic-escape.mp4"
  caption: "Le menu sur Mars, puis une partie : chaque case posée trace le chemin, le monstre aux trousses."
