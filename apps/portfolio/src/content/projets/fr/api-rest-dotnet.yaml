# API REST .NET (Shard), la fiche en français. Vérifiée dans le code (le dépôt GitLab de l'école, public depuis) le 11 octobre 2026.
why: "Un projet d'école en C# : construire en équipe le serveur d'un jeu de stratégie spatiale, une version après l'autre. Chaque version ajoutait des règles, et les tests du cours disaient si l'API les respectait."
features:
  - title: "Un univers à explorer"
    text: "Des systèmes stellaires et leurs planètes, générés au démarrage. J'en ai écrit les premières routes, celles qui listent les systèmes et leurs planètes."
  - title: "Des unités et des bâtiments"
    text: "Éclaireurs, constructeurs, chasseurs, croiseurs… voyagent de système en système, et les mines extraient les ressources de leur planète, minute après minute."
  - title: "Des combats et des trous de ver"
    text: "Toutes les six secondes, les vaisseaux armés font feu sur les unités ennemies ; un trou de ver fait passer une unité sur un autre serveur Shard."
choices:
  - title: "ASP.NET Core"
    text: "Des contrôleurs REST, l'injection de dépendances, et un service en tâche de fond pour les combats."
  - title: "Une horloge qu'on remplace"
    text: "Le temps du jeu passe par l'horloge du cours : les tests l'avancent à la main, sans attendre six secondes ni une minute."
  - title: "Les tests pour juge"
    text: "Six versions, chacune validée par les tests d'intégration xUnit du cours, dans la CI GitLab : de 8 à 45 tests, tous au vert."
video:
  src: "/demos/api-rest-dotnet.mp4"
  caption: "Une vraie partie sur l'API, lancée en local : l'univers, un joueur, un voyage, une mine, un combat, puis les tests de la CI. Requêtes et réponses réelles, attentes coupées."
  width: 1280
  height: 720
screens:
  - image: "systemes"
    title: "Les planètes"
    text: "Un système, puis l'une de ses planètes : les routes de la première version, celles que j'ai écrites."
    alt: "La console de la démo : GET sur une planète d'un système, et sa réponse JSON, un nom et une taille."
  - image: "voyage"
    title: "Le voyage"
    text: "Une minute de jeu plus tard, l'éclaireur est arrivé : la réponse donne son système, sa destination et ses ressources."
    alt: "GET sur une unité « scout » une minute plus tard : son système d'arrivée est surligné."
  - image: "combat"
    title: "Le combat"
    text: "L'administrateur pose un chasseur dans le système ; ses armes tirent toutes les six secondes, selon une liste de cibles prioritaires."
    alt: "PUT d'un chasseur en tant qu'admin : sa santé, ses cibles prioritaires et ses armes."
  - image: "tests"
    title: "Les tests"
    text: "Le bilan de la CI GitLab, version par version : de 8 à 45 tests d'intégration, tous passés."
    alt: "Six barres vertes, de v1 à v6 : 8/8, 15/15, 21/21, 21/21, 45/45 et 21/21 tests passés."
architecture:
  intro: "Le serveur d'un jeu de stratégie spatiale en ASP.NET Core : une API REST, un monde gardé en mémoire, et une horloge qu'on remplace pour tester des minutes de jeu en un instant."
  groups:
    - { label: "Le serveur, en .NET 7", from: [1, 2], to: [3, 2] }
  nodes:
    - { id: "tests", at: [1, 1], kind: "ext", title: "Les tests du cours", text: "xUnit : des parties entières jouées contre l'API, avec une horloge truquée." }
    - { id: "api", at: [2, 1], kind: "server", title: "L'API ASP.NET Core", text: "Systèmes, joueurs, unités, bâtiments ; authentification Basic, un rôle admin." }
    - { id: "other", at: [3, 1], kind: "ext", title: "Un autre serveur Shard", text: "Un vaisseau peut y sauter par un trou de ver." }
    - { id: "clock", at: [1, 2], kind: "job", title: "L'horloge", text: "Celle du cours : voyages, chantiers et combats l'attendent." }
    - { id: "game", at: [2, 2], kind: "app", title: "Le jeu", text: "Unités, mines, ports spatiaux ; une tâche de fond fait combattre toutes les 6 s." }
    - { id: "memory", at: [3, 2], kind: "data", title: "En mémoire", text: "Le monde, généré au démarrage ; MongoDB essayé en v7, inachevé." }
  links:
    - { from: "tests", to: "api", label: "HTTP" }
    - { from: "api", to: "other", label: "le saut : PUT, puis 308" }
    - { from: "api", to: "game", label: "injection de dépendances" }
    - { from: "game", to: "clock", label: "attend" }
    - { from: "game", to: "memory", label: "le monde", both: true }
crew:
  title: "En binôme"
  text: "Un projet de cours, à deux, en grande partie en pair programming. J'ai écrit les débuts : les routes des systèmes et des planètes, les premiers modèles de joueurs et d'unités, et les déplacements des éclaireurs ; pour la suite, des mines aux combats, mon binôme a pris le clavier."
  log:
    - title: "Période"
      text: "De septembre 2023 à janvier 2024."
    - title: "Le cours"
      text: "Un cours de C# à l'EFREI : le gabarit, l'horloge et les tests de notation venaient du professeur."
    - title: "Méthode"
      text: "Du pair programming, une branche par version, de v1 à v7 ; chacune rejoint prod par une merge request."
    - title: "Qualité"
      text: "La CI GitLab compile, puis lance les tests de notation un jour après chaque push ; un robot inscrit la note dans le dépôt."
