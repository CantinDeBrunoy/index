# INDEX, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Mes projets vivaient chacun dans son coin, et certains s'endormaient sur les offres gratuites. INDEX les réunit dans un seul dépôt, les garde éveillés et les présente ici, comme les escales d'un voyage."
features:
  - title: "Un seul dépôt"
    text: "Mes projets actifs réunis dans un même dépôt, chacun dans son dossier, presque tous avec leur historique."
  - title: "Rien ne s'endort"
    text: "Un robot garde la base de Tonalli éveillée, vérifie chaque site toutes les heures et ouvre un ticket quand l'un d'eux tombe."
  - title: "Chaque projet à sa place"
    text: "Une escale, une fiche et, quand il en a une, son app à ouvrir d'ici."
choices:
  - title: "pnpm et Turborepo"
    text: "Chaque projet garde ses propres versions, et seuls ceux qui changent sont reconstruits et testés."
  - title: "Cloudflare, sauf Tonalli"
    text: "Les apps tournent sur Cloudflare Workers ; seul Tonalli reste sur Vercel, pour ne pas déconnecter ses utilisateurs."
  - title: "Le réveil chez Cloudflare"
    text: "Une tâche planifiée du Worker garde Supabase éveillé par une vraie requête ; si GitHub suspend une tâche du dépôt, un ticket me prévient."
video:
  src: "/demos/index.mp4"
  caption: "Le départ, trois escales, la fiche de Hublot, puis le carnet et ses raccourcis vers les apps."
