# Tonalli, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026.
why: "Je voulais garder la trace de mes journées sans en faire un réseau social : pas de fil d'actualité, pas de commentaires, juste un mois qui se colore case après case."
features:
  - title: "Une couleur par jour"
    text: "Une émotion parmi douze, en trois intensités, donne sa couleur à la journée."
  - title: "Deux photos sur le moment"
    text: "La scène puis le visage, d'un seul appui dans l'app, jamais depuis la galerie."
  - title: "Le calendrier de l'autre"
    text: "Il ne se dévoile qu'une fois sa propre journée remplie, et on y répond d'un emoji."
  - title: "Un rappel à mon heure"
    text: "Une notification, à l'heure choisie, rappelle de remplir sa journée ; une journée validée hors ligne part dès que la connexion revient."
choices:
  - title: "La réciprocité écrite dans la base"
    text: "Les règles d'accès de Supabase l'appliquent en SQL, et on ne peut pas la contourner depuis le navigateur."
  - title: "Le jour de l'auteur"
    text: "La date d'une entrée se calcule dans le fuseau horaire de celui qui l'écrit, jamais en UTC ; sinon, le soir, la journée se décale."
  - title: "Un site plutôt qu'une app"
    text: "Tonalli a commencé en app mobile, puis est devenu un site qu'on peut installer : un lien suffit pour commencer."
video:
  src: "/demos/tonalli.mp4"
  caption: "Le concept, l'émotion du jour, les deux photos, la journée de l'autre qui se découvre, le calendrier et le personnage. Avec un compte de démonstration."
  width: 1280
  height: 720
capture:
  alt: "Capture de Tonalli : l'écran d'accueil, le personnage-goutte et les boutons de connexion."
  caption: "L'écran d'accueil."
