# Métro Pathfinder, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026, réécrite plus simplement le 14 octobre.
why: "Un projet d'école, pour le cours de théorie des graphes de l'EFREI. À quatre, nous devions trouver le trajet le plus rapide entre deux stations du métro parisien."
features:
  - title: "Deux stations, un trajet"
    text: "On clique sur la station de départ, puis sur celle d'arrivée, et le trajet le plus rapide se dessine sur le plan."
  - title: "Le réseau en graphe"
    text: "Le programme voit le métro comme un graphe : les stations sont des points, et les tronçons entre elles des liens. Une station où passent trois lignes compte trois fois, une par ligne."
  - title: "Un logiciel pour ordinateur"
    text: "Métro Pathfinder n'est pas un site web. C'est un programme Java qu'on lance sur son ordinateur, et le plan du métro s'ouvre dans une fenêtre."
choices:
  - title: "L'algorithme de Dijkstra"
    text: "C'est la méthode classique pour trouver le plus court chemin dans un graphe. Comme les temps de trajet ne sont jamais négatifs, elle donne toujours le bon résultat, et on peut le vérifier à la main."
  - title: "Java et Swing"
    text: "Toute l'équipe connaissait déjà Java, et Swing, sa boîte à outils pour les fenêtres, suffisait pour afficher le plan. Notre temps est donc allé à l'algorithme, pas à l'apprentissage d'un nouvel outil."
video:
  src: "/demos/metro-pathfinder.mp4"
  caption: "Le plan du métro vu comme un graphe, un trajet calculé, puis l'algorithme de Dijkstra et le code. Monté à partir de l'enregistrement de 2022."
  width: 1280
  height: 720
screens:
  - image: "plan"
    title: "Le plan"
    text: "Le plan du métro et du RER s'ouvre dans une fenêtre. On clique sur la station de départ, puis sur celle d'arrivée."
    alt: "La fenêtre de Métro Pathfinder : le plan du métro et du RER parisiens."
  - image: "trajet"
    title: "Le trajet"
    text: "Le trajet se dessine en points bleus sur le plan. Le détail, station par station, s'affiche en texte dans la console."
    alt: "Le même plan, avec un trajet en points bleus de Pont de Levallois jusqu'à l'est de Paris."
architecture:
  intro: "Un programme Java qui tourne sur l'ordinateur, sans base de données ni connexion. Tout le métro, avec ses temps de trajet, tient dans deux fichiers texte lus au lancement."
  groups: []
  nodes:
    - { id: "files", at: [1, 1], kind: "file", title: "Deux fichiers texte", text: "376 sommets, 473 tronçons avec leur durée, et la position de chaque station sur le plan." }
    - { id: "graph", at: [2, 1], kind: "data", title: "Le graphe", text: "Une station desservie par trois lignes compte trois sommets." }
    - { id: "algos", at: [3, 1], kind: "app", title: "Les algorithmes", text: "Parcours en profondeur, Dijkstra pour le plus court chemin, Kruskal pour l'arbre couvrant." }
    - { id: "user", at: [2, 2], kind: "user", title: "Moi", text: "Deux clics sur le plan." }
    - { id: "ui", at: [3, 2], kind: "app", title: "La fenêtre Swing", text: "Le plan et le trajet en points bleus. Le détail s'affiche dans la console." }
  links:
    - { from: "files", to: "graph", label: "lus au lancement" }
    - { from: "graph", to: "algos", label: "sommets, arêtes" }
    - { from: "user", to: "ui", label: "deux clics" }
    - { from: "ui", to: "algos", label: "deux stations, le trajet", both: true }
crew:
  title: "À quatre"
  text: "Un projet de théorie des graphes, à quatre. J'ai écrit l'essentiel du code : la lecture du réseau, le graphe et ses trois algorithmes."
  log:
    - title: "Période"
      text: "Octobre 2022."
    - title: "Le cours"
      text: "« Métro, Boulot, Dodo », en théorie des graphes, à l'EFREI."
    - title: "Méthode"
      text: "Une branche par personne, puis un rapport de huit pages : le partage des tâches, le choix du langage, le diagramme de classes, et chaque algorithme expliqué."
    - title: "Outils"
      text: "Java, Swing, Eclipse et un Makefile."
