# Visit Match, la fiche en français. Brouillon, à réécrire.
why: "Un projet d'école d'ingénieur, mené jusqu'au business plan. Voyager seul, c'est libre, mais on a parfois envie de partager une visite : Visit Match met en relation les voyageurs solo qui partagent les mêmes destinations et les mêmes envies."
features:
  - title: "Ses envies en commun"
    text: "On indique ses destinations et ses centres d'intérêt."
choices:
  - title: "Flutter"
    text: "Une seule base de code pour iOS et Android."
  - title: "Firebase"
    text: "Les comptes et les données sans serveur à maintenir."
  - title: "Figma d'abord"
    text: "Les écrans dessinés et discutés avant la première ligne de code."
video:
  src: "/demos/visit-match.mp4"
  caption: "L'inscription, les lieux à garder ou à passer, les carnets, les likes, la carte et le profil, avec un compte de test."
  width: 1280
  height: 720
