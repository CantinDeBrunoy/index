# Visit Match, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026, réécrite plus simplement le 14 octobre.
why: "Quand on découvre une ville, on ne sait pas toujours quoi visiter. Visit Match propose les lieux autour de soi, et on garde ceux qui donnent envie. Nous l'avons imaginé à six, en école d'ingénieur, et mené jusqu'au business plan."
features:
  - title: "Ses envies d'abord"
    text: "À l'inscription, on choisit ce qui nous intéresse : monuments, musées, parcs, randonnées…"
  - title: "Un lieu, un geste"
    text: "Les lieux autour de soi défilent, et un geste suffit pour garder un lieu ou le passer. Chaque lieu a sa fiche, avec la distance, le prix, des photos et le plan."
  - title: "Un carnet par voyage"
    text: "Les lieux gardés vont dans le carnet du voyage. On peut les trier par date, par prix ou par catégorie, et les épingler sur la carte."
choices:
  - title: "Flutter"
    text: "Flutter permet d'écrire l'application une seule fois pour l'iPhone et pour Android."
  - title: "Firebase"
    text: "Firebase, le service de Google, s'occupe des comptes et des données. Nous n'avions donc aucun serveur à faire tourner nous-mêmes."
  - title: "Figma d'abord"
    text: "Nous avons dessiné les écrans sur Figma et nous les avons montrés à de futurs utilisateurs, avant d'écrire la moindre ligne de code."
video:
  src: "/demos/visit-match.mp4"
  caption: "Les lieux à garder ou à passer, leur fiche, les carnets, les likes et la carte, avec un compte de test. Mets le son, il y a de la musique."
  width: 1920
  height: 1080
  rate: 1
screens:
  - image: "carte-lieu"
    title: "Un lieu"
    text: "Les lieux autour de soi arrivent un par un, avec leur distance, leur catégorie et leur prix. Pour chacun, trois boutons : passer, le mettre dans un carnet, ou l'aimer."
    alt: "La carte du Panthéon : à 2 km, monument, deux dollars, et les boutons passer, carnet et aimer."
  - image: "detail"
    title: "Sa fiche"
    text: "Une description, des photos, et un bouton pour le voir sur le plan."
    alt: "La fiche du Panthéon : distance, catégorie, prix, description, photo et « Voir sur le plan »."
  - image: "likes"
    title: "Les lieux aimés"
    text: "Ils se trient par date, par gamme de prix ou par catégorie."
    alt: "La liste des lieux aimés, Notre-Dame et le Trocadéro, sous le menu de tri : chronologique, gamme de prix, catégorie."
  - image: "plan"
    title: "La carte"
    text: "Les lieux sur une carte (Mapbox), chacun avec l'icône de sa catégorie."
    alt: "Une carte où une vingtaine d'épingles se regroupent au centre."
