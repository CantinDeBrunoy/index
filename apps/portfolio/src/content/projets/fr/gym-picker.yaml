# gym-picker, la fiche en français. Relue et vérifiée dans le code le 10 octobre 2026, réécrite plus simplement le 14 octobre.
why: "J'ai plusieurs salles de sport à peu près à la même distance, et c'est la circulation qui décide laquelle est la plus rapide à rejoindre. Plutôt que de vérifier chacune dans Waze, j'ouvre gym-picker, qui les compare toutes d'un coup."
features:
  - title: "Le trafic en temps réel"
    text: "Les salles s'affichent de la plus proche à la plus lointaine en temps de trajet en voiture, bouchons compris."
  - title: "Un appui, et c'est parti"
    text: "On touche une salle, et Waze s'ouvre avec le trajet prêt. Un bouton « Maps » fait la même chose avec Google Maps."
choices:
  - title: "Le trafic de TomTom, via Cloudflare"
    text: "Les temps de trajet viennent de TomTom, mais l'app ne l'appelle jamais directement. Elle passe par un petit serveur chez Cloudflare, qui garde la clé d'accès secrète et limite chaque adresse IP à 20 demandes par minute."
  - title: "Ma position hors des journaux"
    text: "L'app envoie ma position dans le contenu de la requête, pas dans l'adresse. Comme les journaux du serveur enregistrent les adresses, ma position n'y apparaît jamais."
video:
  src: "/demos/gym-picker.mp4"
  caption: "Les salles classées par temps de trajet, le classement qui suit le trafic, puis le domicile de secours. Avec des salles et des trajets fictifs."
  width: 1280
  height: 720
screens:
  - image: "classement"
    title: "Le classement"
    text: "Les salles triées par temps de trajet en voiture, bouchons compris, la plus rapide en vert. Le calcul prend une ou deux secondes, affichées en haut."
    alt: "gym-picker en mode démo : quatre salles fictives classées, Palais-Royal en tête à 7 minutes."
  - image: "actualiser"
    title: "Le trafic change"
    text: "« Actualiser » relance le calcul. Avec le trafic, la salle la plus rapide n'est pas toujours la même d'une fois à l'autre."
    alt: "Le même classement après « Actualiser » : Odéon passe en tête, Palais-Royal tombe à 15 minutes."
  - image: "domicile"
    title: "Sans GPS"
    text: "Si le GPS ne répond pas, les trajets partent du domicile de secours, enregistré sur le téléphone et nulle part ailleurs."
    alt: "Le message « GPS indisponible : trajets calculés depuis ton domicile » au-dessus du classement."
architecture:
  intro: "Une petite app React qu'on installe sur son téléphone, et un Worker Cloudflare qui interroge TomTom à sa place. Il n'y a pas de base de données. Les salles sont écrites dans le code, et le domicile reste sur le téléphone."
  groups:
    - { label: "Sur le téléphone", from: [1, 1], to: [2, 2] }
    - { label: "Cloudflare", from: [3, 1], to: [3, 1] }
  nodes:
    - { id: "local", at: [1, 1], kind: "data", title: "GPS · domicile", text: "Une position rapide plutôt que précise. Sans GPS, le domicile de secours, gardé ici." }
    - { id: "app", at: [2, 1], kind: "app", title: "L'app React", text: "S'ouvre depuis le cache, mais les temps de trajet se calculent toujours en direct. Un visiteur voit une démo, avec des salles inventées." }
    - { id: "waze", at: [2, 2], kind: "ext", title: "Waze · Google Maps", text: "Toucher une salle ouvre le trajet." }
    - { id: "worker", at: [3, 1], kind: "server", title: "Worker gym-picker", text: "Vérifie la position, limite à 20 appels par minute, trie les salles." }
    - { id: "tomtom", at: [4, 1], kind: "ext", title: "TomTom Matrix Routing", text: "Les temps de trajet vers toutes les salles d'un coup, trafic compris." }
  links:
    - { from: "app", to: "local", label: "la position" }
    - { from: "app", to: "worker", label: "la position, pas dans l'URL", both: true }
    - { from: "worker", to: "tomtom", label: "un appel, 4 s au plus", both: true }
    - { from: "app", to: "waze", label: "un toucher" }
crew:
  title: "Seul à bord"
  text: "Un outil pour moi, construit seul avec l'aide de Claude Code. J'ai commencé par un vrai cahier des charges : le besoin, un critère de réussite (la réponse en moins de 5 secondes), puis les décisions et leurs raisons."
  log:
    - title: "Période"
      text: "Fin septembre 2026, puis le mode démo en octobre."
    - title: "Méthode"
      text: "Un document de passation : le besoin, l'architecture, les décisions, les pièges. Des commits conventionnels."
    - title: "Qualité"
      text: "Une vingtaine de tests Vitest sur les fonctions pures, plus oxlint et TypeScript à chaque push."
    - title: "Mise en ligne"
      text: "GitHub Actions déploie le Worker à chaque push. La clé TomTom est rangée dans les secrets du Worker."
