# gym-picker, la fiche en français. Brouillon, à réécrire.
why: "Mes salles de sport sont à distance comparable : c'est le trafic qui décide laquelle est la plus proche. Plutôt que de les vérifier une par une dans Waze, l'app les compare toutes d'un coup."
features:
  - title: "Le trafic en temps réel"
    text: "Toutes les salles classées par temps de trajet en voiture, bouchons compris."
  - title: "Un appui, et c'est parti"
    text: "Toucher une salle ouvre Waze ou Google Maps sur le bon trajet."
choices:
  - title: "Un Worker Cloudflare devant l'API"
    text: "La clé ne quitte jamais le serveur, et chaque adresse IP est limitée à 20 appels par minute."
video:
  src: "/demos/gym-picker.mp4"
  caption: "Les salles classées par temps de trajet, le classement qui suit le trafic, puis le domicile de secours. Avec des salles et des trajets fictifs."
  width: 1280
  height: 720
