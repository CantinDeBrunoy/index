name: deploy-hublot-page

# Déploie apps/hublot sur Cloudflare Workers, seulement quand son dossier (ou un package
# partagé, ou le lockfile) change sur main.

on:
  push:
    branches: [main]
    paths:
      - apps/hublot/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-hublot-page.yml
      - .github/workflows/_deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # La page est servie par Cloudflare dès maintenant ; seul le cron (hublot-check.yml) attend la bascule.
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      app: hublot
    secrets: inherit
