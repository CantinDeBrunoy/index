name: mithril

# CI de Mithril (apps/mithril), reprise de son dépôt d'origine. Le projet est en C# compilé
# par le csc.exe de Windows : il reste hors de pnpm et de Turborepo, avec ses propres jobs.
#
# Trois garde-fous, avec des portées différentes :
#   1. tests           - à chaque push qui touche Mithril
#   2. couverture      - à chaque push qui touche Mithril : mesure et publie un bilan
#   3. audit-securite  - sur toute pull request vers main, et sur main (34 contrôles + CodeQL)

on:
  push:
    branches: ["**"]
    paths:
      - apps/mithril/**
      - .github/workflows/mithril.yml
  pull_request:
    branches: [main]
    paths:
      - apps/mithril/**
      - .github/workflows/mithril.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: apps/mithril

jobs:
  tests:
    name: Tests unitaires
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Le .NET Framework 4 est préinstallé sur les runners Windows : rien à installer.
      - name: Vérifier la présence du compilateur
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe introuvable sur le runner." }
          Write-Host "Compilateur : $csc"

      # Plus strict que build.ps1 en local : le moindre avertissement fait échouer la CI.
      - name: Compilation stricte (avertissements = erreurs)
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sources = @(Get-ChildItem "src" -Filter *.cs -File | ForEach-Object { $_.FullName })
          & $csc -nologo -target:winexe -codepage:65001 -warn:4 -warnaserror+ `
            -r:System.Security.dll -out:"$env:RUNNER_TEMP\strict.exe" $sources
          if ($LASTEXITCODE -ne 0) { throw "Compilation stricte échouée." }

      - name: Compiler et exécuter le banc de test
        run: ./outils/build.ps1

  couverture:
    name: Couverture des tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # dotnet-coverage instrumente dynamiquement et supporte le .NET Framework
      # (Coverlet exige des PDB portables). Le SDK .NET est préinstallé sur le runner.
      - name: Installer dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      # Seuil à 0 tant que la première mesure réelle n'a pas eu lieu : le job mesure et
      # publie sans bloquer.
      - name: Mesurer la couverture
        id: couverture
        continue-on-error: true
        run: ./outils/couverture.ps1 -Seuil 0 -Rapport rapport-couverture.md

      - name: Publier le bilan dans le résumé
        if: always()
        run: |
          if (Test-Path rapport-couverture.md) {
            Get-Content rapport-couverture.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## Couverture des tests`n`nLa mesure n'a pas abouti : voir le journal du job." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Publier le bilan en artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilan-couverture
          path: |
            apps/mithril/rapport-couverture.md
            apps/mithril/couverture.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          if ("${{ steps.couverture.outcome }}" -ne "success") {
            throw "La mesure de couverture a échoué (voir le journal). Aucun seuil n'est encore appliqué."
          }
          Write-Host "Couverture mesurée et publiée."

  audit-securite:
    name: Audit de sécurité
    # Pull requests vers main (pour bloquer le merge) et main lui-même.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # L'historique complet est nécessaire : l'audit cherche les secrets dans tous les
      # commits du dossier de Mithril, pas seulement dans l'arbre de travail.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # continue-on-error : on veut le bilan complet (audit + CodeQL) même en cas d'échec.
      # Le verdict est rendu par la dernière étape du job.
      - name: Contrôles de sécurité du projet
        id: audit
        continue-on-error: true
        run: ./outils/audit-securite.ps1 -Rapport rapport-audit.md

      # CodeQL est gratuit sur les dépôts publics ; sur un dépôt privé il exige GitHub
      # Advanced Security. Les étapes sont donc conditionnées à la visibilité.
      - name: Initialiser CodeQL
        if: github.event.repository.private == false
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          source-root: apps/mithril
          queries: security-extended

      - name: Analyse CodeQL
        id: codeql
        if: github.event.repository.private == false
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          output: apps/mithril/resultats-codeql
          upload: always

      # L'action CodeQL remonte les alertes sans faire échouer le job : on compte les
      # résultats nous-mêmes et on les ajoute au bilan.
      - name: Ajouter CodeQL au bilan
        id: bilan-codeql
        if: always()
        run: |
          $lignes = @("", "## Analyse statique CodeQL", "")
          $total = 0
          $dossier = "resultats-codeql"
          if (-not (Test-Path $dossier)) {
            $lignes += "CodeQL n'a pas été exécuté (dépôt privé, ou étape en échec)."
          } else {
            $lignes += "| Règle | Emplacement |"
            $lignes += "|---|---|"
            foreach ($f in (Get-ChildItem $dossier -Filter *.sarif)) {
              $sarif = Get-Content $f.FullName -Raw | ConvertFrom-Json
              foreach ($run in $sarif.runs) {
                foreach ($r in $run.results) {
                  $total++
                  $lieu = $r.locations[0].physicalLocation
                  $lignes += "| ``$($r.ruleId)`` | ``$($lieu.artifactLocation.uri):$($lieu.region.startLine)`` |"
                }
              }
            }
            if ($total -eq 0) { $lignes = $lignes[0..2] + "Aucune alerte (requêtes ``security-extended``)." }
          }
          $lignes | Out-File -FilePath rapport-audit.md -Append -Encoding utf8
          "alertes=$total" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Alertes CodeQL : $total"

      - name: Publier le bilan dans le résumé
        if: always()
        run: Get-Content rapport-audit.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publier le bilan en artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilan-audit-securite
          path: apps/mithril/rapport-audit.md
          retention-days: 90

      # Verdict : c'est ici, et seulement ici, que le job passe au rouge.
      - name: Verdict
        if: always()
        run: |
          $echecs = @()
          if ("${{ steps.audit.outcome }}" -ne "success") {
            $echecs += "l'audit du projet a relevé des constats bloquants"
          }
          if ([int]"${{ steps.bilan-codeql.outputs.alertes }}" -gt 0) {
            $echecs += "CodeQL a remonté ${{ steps.bilan-codeql.outputs.alertes }} alerte(s)"
          }
          if ("${{ github.event.repository.private }}" -eq "true") {
            Write-Warning "Dépôt privé : CodeQL désactivé (nécessite GitHub Advanced Security)."
          }
          if ($echecs.Count -gt 0) {
            throw ("Audit de sécurité en échec : " + ($echecs -join " ; ") + ". Voir le bilan ci-dessus.")
          }
          Write-Host "Audit de sécurité : aucun constat bloquant."
