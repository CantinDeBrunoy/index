name: _deploy-cloudflare

# Déploiement réutilisable d'une app du monorepo sur Cloudflare Workers :
# build avec Turborepo (dépendances @index/* comprises), puis wrangler deploy dans apps/<app>.
# Appelé par deploy-<app>.yml, qui ne se déclenche que quand le dossier de l'app change.

on:
  workflow_call:
    inputs:
      app:
        description: Dossier dans apps/ (et nom du package)
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Déployer ${{ inputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      # Tant que les secrets Cloudflare ne sont pas configurés, on prévient sans échouer.
      - name: Secrets Cloudflare
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID manquant : déploiement de ${{ inputs.app }} ignoré."
          fi

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.secrets.outputs.ok == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile --filter "${{ inputs.app }}..."

      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm turbo run build --filter="${{ inputs.app }}"

      - if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/${{ inputs.app }}
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
